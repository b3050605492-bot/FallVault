<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    background: linear-gradient(160deg, #12121E 0%, #1A1A2E 60%, #12121E 100%);
    color: #E8E8F0;
    font-family: -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif;
    padding: 16px;
  }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(125,211,192,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .title { font-size: 15px; font-weight: 700; }
  .subtitle { font-size: 11px; color: #8a8a9a; margin-top: 2px; }

  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .status-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-green { background: #7DD3C0; box-shadow: 0 0 8px #7DD3C0; }
  .dot-red { background: #D47070; box-shadow: 0 0 8px #D47070; }
  .dot-gray { background: #666; }

  .pair-form { margin-top: 10px; }
  .pair-form input {
    width: 100%; padding: 9px 12px; border-radius: 8px; font-size: 14px;
    border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.07);
    color: #E8E8F0; outline: none; font-family: monospace; letter-spacing: 2px;
  }
  .pair-form input:focus { border-color: #7DD3C0; }

  .btn {
    width: 100%; margin-top: 8px; padding: 9px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .btn-primary { background: rgba(125,211,192,0.25); color: #7DD3C0; }
  .btn-primary:hover { background: rgba(125,211,192,0.35); }
  .btn-danger { background: rgba(212,112,112,0.15); color: #D47070; }
  .btn-danger:hover { background: rgba(212,112,112,0.25); }
  .btn-ghost { background: rgba(255,255,255,0.08); color: #bbb; }
  .btn-ghost:hover { background: rgba(255,255,255,0.14); }

  .hint { font-size: 11px; color: #8a8a9a; margin-top: 8px; line-height: 1.6; }
  .error { color: #D47070; font-size: 12px; margin-top: 8px; min-height: 16px; }
  .error:empty { display: none; }
  .footer { text-align: center; font-size: 10px; color: #666; margin-top: 6px; }
  .open-btn { margin-top: 10px; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">🔑</div>
    <div>
      <div class="title">FallVault 密码助手</div>
      <div class="subtitle">浏览器 ↔ 本地密码库</div>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span class="dot" id="dot"></span>
      <span id="status-text">检测中...</span>
    </div>
    <div id="pair-section" style="display:none">
      <div class="pair-form">
        <input id="code-input" placeholder="输入配对码" autocomplete="off" maxlength="20" />
        <button class="btn btn-primary" id="pair-btn">配对并连接</button>
        <div class="error" id="error"></div>
      </div>
      <div class="hint">打开 FallVault → 设置 → 浏览器扩展 → 复制配对码，粘贴到上方</div>
    </div>
    <div id="paired-section" style="display:none">
      <div class="hint">已连接 FallVault。遇到登录页/注册页时，扩展会自动弹出填充或保存提示。</div>
      <button class="btn btn-ghost" id="open-app">打开 FallVault</button>
      <button class="btn btn-danger" id="unpair-btn">断开连接</button>
    </div>
    <div id="not-running-section" style="display:none">
      <div class="hint">未检测到 FallVault 正在运行。请先启动 FallVault 桌面应用。</div>
      <button class="btn btn-ghost open-btn" id="open-app2">打开 FallVault</button>
    </div>
  </div>

  <div class="footer">FallVault v1.0.0 · 本地加密存储</div>

<script src="popup.js"></script>
</body>
</html>
